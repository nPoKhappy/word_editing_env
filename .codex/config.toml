TMP = 'D:\word_editing_env\.tmp'
PYTHONDONTWRITEBYTECODE = '1'

[mcp_servers.endnote-reference-check]
command = 'C:\Program Files\nodejs\node.exe'
args = ['--import', 'file:///D:/word_editing_env/.tools/endnote/citecheck/node_modules/tsx/dist/loader.mjs', 'D:\word_editing_env\.tools\endnote\citecheck\node_modules\@jhlee0619\citecheck\src\mcp.ts']
cwd = 'D:\word_editing_env'
enabled = true
startup_timeout_sec = 20
tool_timeout_sec = 150
